<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlexBen - ระบบเบิกจ่ายสวัสดิการพนักงาน</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap');

        body {
            font-family: 'Sarabun', sans-serif;
            background-color: #fafafa;
        }

        /* Custom Modal Styles */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            align-items: center;
            justify-content: center;
            z-index: 50;
            backdrop-filter: blur(2px);
        }

        .modal.active {
            display: flex;
        }

        .animate-in {
            animation: slideUp 0.3s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body class="min-h-screen bg-zinc-50 text-zinc-900">

    <!-- Login Page -->
    <div id="login-container" class="flex min-h-screen items-center justify-center p-4">
        <div class="bg-white p-8 rounded-2xl shadow-xl max-w-sm w-full animate-in">
            <div class="flex justify-center mb-6">
                <div class="bg-zinc-900 p-3 rounded-2xl shadow-sm">
                    <i data-lucide="wallet" class="w-8 h-8 text-white"></i>
                </div>
            </div>
            <h2 class="text-2xl font-bold text-center text-zinc-900 mb-2">เข้าสู่ระบบ FlexBen</h2>
            <p class="text-sm text-zinc-500 text-center mb-6">เข้าสู่ระบบด้วยอีเมลและรหัสพนักงาน</p>
            <form onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-zinc-700 mb-1">อีเมล (Email)</label>
                    <input type="email" id="loginEmail" required
                        class="w-full border border-zinc-300 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-zinc-900 transition-shadow"
                        placeholder="email@scg.com">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-zinc-700 mb-1">รหัสผ่าน (รหัสพนักงาน / ID)</label>
                    <input type="password" id="loginPassword" required
                        class="w-full border border-zinc-300 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-zinc-900 transition-shadow"
                        placeholder="รหัสพนักงาน">
                </div>
                <button type="submit" id="loginBtn" disabled
                    class="w-full bg-zinc-900 text-white rounded-xl py-3 font-semibold hover:bg-zinc-800 transition-transform active:scale-[0.98] shadow-md flex justify-center items-center gap-2">
                    <i data-lucide="loader-2" class="w-4 h-4 animate-spin hidden" id="loginSpinner"></i>
                    <span id="loginBtnText">กำลังโหลดข้อมูล...</span>
                </button>
            </form>
            <p id="loginError" class="text-rose-500 text-sm text-center mt-4 hidden">อีเมลหรือรหัสผ่านไม่ถูกต้อง</p>
        </div>
    </div>

    <!-- Main App -->
    <div id="app-container" class="hidden flex-col min-h-screen">
        <!-- Header -->
        <header class="bg-white border-b border-zinc-200 sticky top-0 z-10 shadow-sm">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex justify-between h-16 items-center">
                    <div class="flex items-center gap-3">
                        <div class="bg-zinc-900 p-2 rounded-xl shadow-sm">
                            <i data-lucide="wallet" class="w-5 h-5 text-white"></i>
                        </div>
                        <h1 class="text-xl font-bold tracking-tight text-zinc-900">FlexBen</h1>
                    </div>

                    <div class="flex items-center gap-4">
                        <div class="flex items-center gap-3">
                            <div class="text-right hidden sm:block">
                                <p class="text-sm font-semibold text-zinc-900" id="header-user-name">สกุลไทย ใจดี</p>
                                <p class="text-xs text-zinc-500 capitalize" id="header-user-role">HR Admin</p>
                            </div>
                            <div
                                class="w-9 h-9 rounded-full bg-zinc-100 flex items-center justify-center border border-zinc-200 shadow-sm">
                                <i data-lucide="user" class="w-4 h-4 text-zinc-600"></i>
                            </div>
                            <button
                                class="p-2 text-zinc-400 hover:text-rose-600 hover:bg-rose-50 rounded-lg transition-colors"
                                title="ออกจากระบบ" onclick="logout()">
                                <i data-lucide="log-out" class="w-4 h-4"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </header>

        <div class="flex-1 flex flex-col md:flex-row max-w-7xl mx-auto w-full">
            <!-- Sidebar Navigation -->
            <aside
                class="w-full md:w-64 p-4 md:p-6 border-b md:border-b-0 md:border-r border-zinc-200 bg-white md:bg-transparent">
                <nav class="space-y-2">
                    <button onclick="switchTab('portal')" id="nav-portal"
                        class="w-full flex items-center gap-3 px-4 py-3 text-sm font-medium rounded-lg transition-colors bg-zinc-900 text-white shadow-sm">
                        <i data-lucide="clipboard-list" class="w-4 h-4"></i>
                        Employee Portal
                    </button>
                    <button onclick="switchTab('dashboard')" id="nav-dashboard" style="display: none;"
                        class="w-full flex items-center gap-3 px-4 py-3 text-sm font-medium rounded-lg transition-colors text-zinc-600 hover:bg-zinc-100">
                        <i data-lucide="layout-dashboard" class="w-4 h-4"></i>
                        HR Dashboard
                    </button>
                </nav>
            </aside>

            <!-- Main Content Area -->
            <main class="flex-1 p-4 md:p-8 overflow-auto" id="main-content">
                <!-- Content will be injected here via Javascript -->
            </main>
        </div>
    </div>

    <!-- Modal: New Request -->
    <div id="requestModal" class="modal">
        <div class="bg-white rounded-2xl shadow-xl max-w-md w-full p-6 animate-in relative mx-4">
            <button onclick="closeModal('requestModal')"
                class="absolute top-4 right-4 text-zinc-400 hover:text-zinc-700 bg-zinc-100 hover:bg-zinc-200 rounded-full p-1 transition-colors">
                <i data-lucide="x" class="w-4 h-4"></i>
            </button>
            <h2 class="text-xl font-bold text-zinc-900 mb-1">สร้างคำขอเบิกสวัสดิการใหม่</h2>
            <p class="text-sm text-zinc-500 mb-6">กรุณากรอกข้อมูลการเบิกจ่ายและแนบเลขที่ใบเสร็จให้ครบถ้วน</p>

            <form onsubmit="submitRequest(event)" class="space-y-4">
                <div class="space-y-1.5">
                    <label class="text-sm font-semibold text-zinc-700">1. ชื่อรายการเบิก (Description)</label>
                    <input type="text" id="reqDesc"
                        class="w-full border border-zinc-300 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-zinc-900 transition-shadow"
                        placeholder="เช่น ค่ายาพาราเซตามอล, ค่าตรวจสุขภาพ" required>
                </div>
                <div class="space-y-1.5">
                    <label class="text-sm font-semibold text-zinc-700">2. หมวดหมู่สวัสดิการ (Category)</label>
                    <select id="reqCategory"
                        class="w-full border border-zinc-300 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-zinc-900 transition-shadow bg-white"
                        required>
                        <option value="" disabled selected>เลือกหมวดหมู่</option>
                        <option value="Health and Wellness">Health and Wellness</option>
                        <option value="Wealth">Wealth</option>
                        <option value="Education">Education</option>
                        <option value="อื่นๆ">อื่นๆ</option>
                    </select>
                </div>
                <div class="space-y-1.5">
                    <label class="text-sm font-semibold text-zinc-700">3. เลขใบเสร็จ (Receipt No.)</label>
                    <input type="text" id="reqReceipt"
                        class="w-full border border-zinc-300 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-zinc-900 transition-shadow"
                        placeholder="กรอกเลขที่ใบเสร็จ" required>
                </div>
                <div class="space-y-1.5">
                    <label class="text-sm font-semibold text-zinc-700">4. จำนวนเงินที่เบิก (Amount)</label>
                    <input type="number" id="reqAmount"
                        class="w-full border border-zinc-300 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-zinc-900 transition-shadow"
                        placeholder="0.00" max="20000" required>
                    <p class="text-[11px] text-red-500 mt-1">* ยอดเบิกสูงสุดไม่เกิน 25,000 บาท ต่อรายการ</p>
                </div>
                <div class="pt-4">
                    <button type="submit"
                        class="w-full bg-zinc-900 text-white rounded-xl py-3 font-semibold hover:bg-zinc-800 transition-transform active:scale-[0.98] shadow-md flex justify-center items-center gap-2">
                        <i data-lucide="send" class="w-4 h-4"></i> ยืนยันการส่งคำขอ
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Javascript Logic for Static Dashboard -->
    <script>
        // Mock Data Storage (To simulate the database)
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxIXpduEXfwu7ommdWWopK50IKxlRDFKRmyKcBcyGXo7FITa-5FFQlNHQ_HxwhfhOHi/exec"; // ⚠️ แทนที่ด้วย URL ของคุณ

        let currentUser = null;
        let appUsers = [];
        let balances = [];
        let requests = [];
        let dashboardChart = null;

        let hrActiveTab = 'overview'; // Default tab for HR Dashboard

        // Initializer
        document.addEventListener('DOMContentLoaded', () => {
            fetchDataFromSheet();
        });

        async function fetchDataFromSheet() {
            try {
                // Show loading state
                const mainContent = document.getElementById('main-content');
                if (mainContent) {
                    mainContent.innerHTML = '<div class="flex flex-col items-center justify-center p-24 text-zinc-400"><i data-lucide="loader-2" class="w-10 h-10 animate-spin mb-4"></i><p class="font-medium">กำลังโหลดข้อมูลจาก Google Sheet...</p></div>';
                    lucide.createIcons();
                }

                const response = await fetch(WEB_APP_URL);
                const result = await response.json();

                // สำหรับตรวจสอบโครงสร้างข้อมูลที่ดึงมา (ให้เปิด F12 ดู Console)
                console.log("ข้อมูลดิบจาก Google Sheet:", result);

                if (result.status === "success") {
                    const data = result.data;

                    if (data.users.length === 0 && data.points.length === 0 && data.logs.length === 0) {
                        console.warn("ไม่พบข้อมูลเลย! ตรวจสอบชื่อ Tab (Sheet) ใน Google Sheet ว่าสะกดตรงตามนี้เป๊ะไหม: 'log daliy', 'point เหลือ', 'User'");
                        alert("⚠️ ระบบดึงข้อมูลมาได้ 0 รายการ\nโปรดตรวจสอบชื่อ Tab ด้านล่างของ Google Sheet ว่าพิมพ์ตรงกับ 'log daliy', 'point เหลือ', 'User' หรือไม่ (ตัวพิมพ์เล็ก-ใหญ่มีผล)");
                    }

                    // Map Users
                    appUsers = data.users.map(u => {
                        let uName = (u["ชื่อ"] || u["Name"] || u["ชื่อ-สกุล"] || "").toString().trim();
                        let uId = (u["รหัส"] || u["ID"] || u["Username"] || u["รหัสพนักงาน"] || "").toString().trim();
                        let uEmail = (u["อีเมล"] || u["Email"] || "").toString().trim();

                        let role = "user";
                        // Find role in column T or related names
                        for (let key in u) {
                            if (key.toLowerCase() === 'role' || key === 'Role' || key.includes('สิทธิ์') || key === 'T' || key === 'role') {
                                let val = (u[key] || "").toString().toLowerCase();
                                if (val.includes('hr') || val.includes('admin')) {
                                    role = "hr";
                                }
                            }
                        }

                        // Sakulthk is always HR Admin
                        if (uId.toLowerCase() === 'sakulthk' || uName.toLowerCase().includes('sakulthk')) {
                            role = "hr";
                        }

                        return { id: uId, name: uName, email: uEmail, role: role, raw: u };
                    });

                    // Map Requests
                    requests = data.logs.map((log, index) => {
                        let reqStatus = "pending";
                        let sheetStatus = log["สถานะ"] ? log["สถานะ"].toString().trim().toLowerCase() : "";
                        if (sheetStatus === "approved" || sheetStatus === "อนุมัติ") reqStatus = "approved";
                        else if (sheetStatus === "rejected" || sheetStatus === "ปฏิเสธ") reqStatus = "rejected";

                        return {
                            id: index + 1,
                            date: log["วันที่"] || "-",
                            ref: 'REQ-' + (1000 + index),
                            requesterName: log["ชื่อคนเบิก"] || "-",
                            requesterEmail: log["Email"] || log["อีเมล"] || "-",
                            category: log["หมวดหมู่"] || "-",
                            title: log["หมวดหมู่"] || "-", // ในตารางจริงไม่มีคอลัมน์รายการ เลยใช้หมวดหมู่แทน
                            receipt: log["เลขที่ใบเสร็จ"] || log["เลขใบเสร็จ"] || "-",
                            amount: parseFloat(log["ยอดเงินเบิก"] || 0),
                            status: reqStatus
                        };
                    }).reverse(); // ให้รายการล่าสุดขึ้นก่อน

                    // Map Balances
                    balances = data.points.map((p, index) => {
                        let total = parseFloat(p["สุทธิ 2026"]) || 0;
                        let email = (p["อีเมล"] || "-").toString().trim();
                        let name = (p["ชื่อ"] || "-").toString().trim();

                        // Calculate dynamically from requests
                        let userReqs = requests.filter(r =>
                            (r.requesterEmail !== "-" && r.requesterEmail === email) ||
                            (r.requesterName !== "-" && r.requesterName === name)
                        );
                        let used = 0;
                        userReqs.forEach(r => {
                            if (r.status === 'approved' || r.status === 'pending') {
                                used += r.amount;
                            }
                        });

                        let remaining = total - used;

                        return {
                            id: index + 1,
                            name: name,
                            email: email,
                            scgId: p["รหัส"] || "-",
                            status: p["STATUS"] || "Active",
                            total: total,
                            used: used,
                            remaining: remaining
                        };
                    });
                }

                // Enable Login
                const loginBtn = document.getElementById('loginBtn');
                const loginBtnText = document.getElementById('loginBtnText');
                if (loginBtn) {
                    loginBtn.disabled = false;
                    loginBtnText.innerText = 'เข้าสู่ระบบ (Login)';
                }

                // If already logged in, refresh view
                if (currentUser) {
                    if (currentUser.role === 'hr') {
                        if (hrActiveTab === 'overview') updateChart();
                        else renderHRDashboard();
                    } else {
                        renderEmployeePortal();
                    }
                }
            } catch (error) {
                console.error("Fetch error:", error);
                const loginBtnText = document.getElementById('loginBtnText');
                if (loginBtnText) loginBtnText.innerText = 'โหลดข้อมูลล้มเหลว';
            }
        }

        function handleLogin(e) {
            e.preventDefault();
            const emailInput = document.getElementById('loginEmail').value.trim().toLowerCase();
            const passwordInput = document.getElementById('loginPassword').value.trim().toLowerCase();

            const user = appUsers.find(u =>
                u.email.toLowerCase() === emailInput &&
                u.id.toLowerCase() === passwordInput
            );

            if (user) {
                currentUser = user;
                document.getElementById('login-container').classList.add('hidden');
                document.getElementById('app-container').classList.remove('hidden');
                document.getElementById('app-container').classList.add('flex');

                document.getElementById('header-user-name').innerText = user.name || user.id;
                document.getElementById('header-user-role').innerText = user.role === 'hr' ? 'HR Admin' : 'Employee';

                if (user.role !== 'hr') {
                    document.getElementById('nav-dashboard').style.display = 'none';
                    switchTab('portal');
                } else {
                    document.getElementById('nav-dashboard').style.display = 'flex';
                    switchTab('dashboard'); // Start HR at dashboard
                }
            } else {
                document.getElementById('loginError').classList.remove('hidden');
            }
        }

        function logout() {
            currentUser = null;
            document.getElementById('loginEmail').value = '';
            document.getElementById('loginPassword').value = '';
            document.getElementById('loginError').classList.add('hidden');
            document.getElementById('app-container').classList.add('hidden');
            document.getElementById('app-container').classList.remove('flex');
            document.getElementById('login-container').classList.remove('hidden');
        }

        // Tab Switching Logic
        function switchTab(tabId) {
            if (tabId === 'dashboard' && currentUser && currentUser.role !== 'hr') {
                alert('คุณไม่มีสิทธิ์เข้าถึงหน้านี้');
                return;
            }

            const portalNav = document.getElementById('nav-portal');
            const dashNav = document.getElementById('nav-dashboard');

            const activeClass = 'w-full flex items-center gap-3 px-4 py-3 text-sm font-medium rounded-lg transition-colors bg-zinc-900 text-white shadow-sm';
            const inactiveClass = 'w-full flex items-center gap-3 px-4 py-3 text-sm font-medium rounded-lg transition-colors text-zinc-600 hover:bg-zinc-100';

            if (tabId === 'portal') {
                portalNav.className = activeClass;
                dashNav.className = inactiveClass;
                renderEmployeePortal();
            } else {
                dashNav.className = activeClass;
                portalNav.className = inactiveClass;
                renderHRDashboard();
            }
            lucide.createIcons();
        }

        // --- View Renderers ---

        function renderEmployeePortal() {
            const container = document.getElementById('main-content');
            const myBalance = balances.find(b => b.email === currentUser.email) || { total: 0, used: 0, remaining: 0 };
            const myRequests = requests.filter(r => r.requesterEmail === currentUser.email);

            let historyHtml = myRequests.length > 0 ? myRequests.map(r => `
                <tr class="border-b border-zinc-100 hover:bg-zinc-50 transition-colors">
                    <td class="p-4 text-sm text-zinc-500 whitespace-nowrap">${r.date}</td>
                    <td class="p-4 text-sm font-mono text-zinc-400">${r.ref}</td>
                    <td class="p-4"><span class="px-2.5 py-1 text-xs bg-zinc-100 border border-zinc-200 rounded-md text-zinc-700">${r.category}</span></td>
                    <td class="p-4 font-medium text-zinc-900">${r.title}</td>
                    <td class="p-4 text-sm text-zinc-500 tabular-nums">${r.receipt}</td>
                    <td class="p-4 font-mono font-medium text-zinc-900 text-right">${r.amount.toLocaleString()}</td>
                    <td class="p-4 text-center">${getStatusBadge(r.status)}</td>
                </tr>
            `).join('') : `<tr><td colspan="7" class="p-8 text-center text-zinc-500">ไม่มีประวัติการเบิกจ่าย</td></tr>`;

            const percentage = (myBalance.remaining / myBalance.total) * 100;

            container.innerHTML = `
                <div class="space-y-6 animate-in">
                    <!-- Top Cards -->
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <!-- Balance Card -->
                        <div class="bg-white p-6 rounded-2xl border border-zinc-200 shadow-sm md:col-span-1 relative overflow-hidden">
                            <div class="absolute top-0 right-0 p-4 opacity-10">
                                <i data-lucide="wallet" class="w-24 h-24"></i>
                            </div>
                            <div class="text-sm font-semibold text-zinc-500 flex items-center gap-2 mb-4">
                                <i data-lucide="wallet" class="w-4 h-4"></i> พอยต์คงเหลือ (Available Points)
                            </div>
                            <div class="text-4xl font-extrabold text-zinc-900 mb-1">${myBalance.remaining.toLocaleString()}</div>
                            <p class="text-xs font-medium text-zinc-500 mb-5">จากพอยต์ทั้งหมด ${myBalance.total.toLocaleString()} GP</p>
                            
                            <div class="h-2 w-full bg-zinc-100 rounded-full overflow-hidden">
                                <div class="h-full bg-emerald-500 transition-all duration-1000 rounded-full" style="width: ${percentage}%"></div>
                            </div>
                            <div class="flex justify-between mt-2 text-[10px] text-zinc-400 font-medium">
                                <span>ใช้ไป: ${myBalance.used.toLocaleString()}</span>
                                <span>100%</span>
                            </div>
                        </div>

                        <!-- Action Card -->
                        <div class="bg-white p-6 rounded-2xl border border-zinc-200 shadow-sm md:col-span-2 flex flex-col justify-center items-center text-center">
                            <div class="bg-zinc-50 p-4 rounded-full mb-4">
                                <i data-lucide="plus" class="w-8 h-8 text-zinc-400"></i>
                            </div>
                            <h3 class="text-lg font-bold text-zinc-900 mb-2">ทำรายการเบิกสวัสดิการ</h3>
                            <p class="text-sm text-zinc-500 mb-6 max-w-md">ยื่นคำขอเบิกค่ารักษาพยาบาล ทำฟัน หรือสวัสดิการอื่นๆ พร้อมแนบเลขที่ใบเสร็จ</p>
                            
                            <button onclick="openModal('requestModal')" class="bg-zinc-900 hover:bg-zinc-800 text-white h-12 px-8 rounded-xl flex items-center gap-2 font-semibold transition-transform active:scale-95 shadow-md">
                                <i data-lucide="plus" class="w-5 h-5"></i> สร้างคำขอใหม่ (New Request)
                            </button>
                        </div>
                    </div>

                    <!-- History Table -->
                    <div class="bg-white rounded-2xl border border-zinc-200 shadow-sm overflow-hidden">
                        <div class="p-5 border-b border-zinc-100 flex justify-between items-center bg-white">
                            <h2 class="text-lg font-bold flex items-center gap-2 text-zinc-800">
                                <i data-lucide="history" class="w-5 h-5 text-blue-600"></i> ประวัติการเบิก (Claim History)
                            </h2>
                        </div>
                        <div class="overflow-x-auto">
                            <table class="w-full text-left border-collapse">

        function updateChart() {
            const empFilter = document.getElementById('filterEmp') ? document.getElementById('filterEmp').value : 'all';
            const monthFilter = document.getElementById('filterMonth') ? document.getElementById('filterMonth').value : 'all';

            let filteredReqs = requests.filter(r => r.status === 'approved'); // นับเฉพาะที่อนุมัติแล้ว

            if (empFilter !== 'all') {
                filteredReqs = filteredReqs.filter(r => r.requesterName === empFilter);
            }

            if (monthFilter !== 'all') {
                filteredReqs = filteredReqs.filter(r => {
                    const parts = r.date.split('/');
                    if (parts.length >= 2) {
                        const m = `${parts[1]}/${parts[2].split(' ')[0]}`;
                        return m === monthFilter;
                    }
                    return false;
                });
            }

            const grouped = {};
            filteredReqs.forEach(r => {
                const parts = r.date.split('/');
                let m = "Unknown";
                if (parts.length >= 2) {
                    m = `${parts[1]}/${parts[2].split(' ')[0]}`;
                }
                if (!grouped[m]) grouped[m] = 0;
                grouped[m] += r.amount;
            });

            const labels = Object.keys(grouped).sort((a, b) => {
                if (a === "Unknown") return 1;
                if (b === "Unknown") return -1;
                const [mA, yA] = a.split('/');
                const [mB, yB] = b.split('/');
                if (yA !== yB) return parseInt(yA) - parseInt(yB);
                return parseInt(mA) - parseInt(mB);
            });
            const data = labels.map(l => grouped[l]);

            const ctx = document.getElementById('reimbursementChart');
            if (!ctx) return;

            if (dashboardChart) {
                dashboardChart.destroy();
            }

            dashboardChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels.length > 0 ? labels : ['ไม่มีข้อมูล'],
                    datasets: [{
                        label: 'ยอดเบิกสวัสดิการ (บาท)',
                        data: data.length > 0 ? data : [0],
                        backgroundColor: '#18181b', // zinc-900
                        borderRadius: 6,
                        barPercentage: 0.6
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            callbacks: {
                                label: function (context) {
                                    return new Intl.NumberFormat('th-TH').format(context.parsed.y) + ' ฿';
                                }
                            }
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: {
                                callback: function (value) {
                                    return new Intl.NumberFormat('th-TH').format(value);
                                }
                            }
                        }
                    }
                }
            });
        }

            if (status === 'rejected') return `<div class="inline-flex items-center gap-1.5 px-2.5 py-1 text-xs font-bold rounded-full bg-rose-50 text-rose-700 border border-rose-200"><i data-lucide="x-circle" class="w-3.5 h-3.5"></i> Rejected</div>`;

        }

        }

        async function submitRequest(e) {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            btn.innerHTML = '<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> กำลังบันทึกข้อมูลลง Sheet...';
            btn.disabled = true;

            const desc = document.getElementById('reqDesc').value;
            const cat = document.getElementById('reqCategory').value;
            const rec = document.getElementById('reqReceipt').value;
            const amt = parseFloat(document.getElementById('reqAmount').value);

            // Check remaining balance
            const myBalance = balances.find(b => b.email === currentUser.email);
            if (!myBalance) {
                alert("ไม่พบข้อมูลสิทธิ์การเบิกสวัสดิการของคุณ");
                btn.innerHTML = '<i data-lucide="send" class="w-4 h-4"></i> ยืนยันการส่งคำขอ';
                btn.disabled = false;
                return;
            }

            if (amt > myBalance.remaining) {
                alert(`ยอดเบิก (${amt.toLocaleString()} บาท) เกินกว่าพอยต์คงเหลือของคุณ (${myBalance.remaining.toLocaleString()} บาท)`);
                btn.innerHTML = '<i data-lucide="send" class="w-4 h-4"></i> ยืนยันการส่งคำขอ';
                btn.disabled = false;
                return;
            }

            const now = new Date();
            const dateStr = `${now.getDate().toString().padStart(2, '0')}/${(now.getMonth() + 1).toString().padStart(2, '0')}/${now.getFullYear()} ${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;

            const payload = {
                action: "addRequest",
                date: dateStr,
                name: currentUser.name,
                email: currentUser.email,
                category: cat,
                description: desc,
                receipt: rec,
                amount: amt
            };

            try {
                await fetch(WEB_APP_URL, {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });
                closeModal('requestModal');
                alert('ส่งคำขอเบิกสวัสดิการสำเร็จ บันทึกลง Google Sheet แล้ว!');
                fetchDataFromSheet(); // โหลดข้อมูลใหม่จาก Sheet เพื่ออัพเดทตาราง
            } catch (error) {
                alert("เกิดข้อผิดพลาดในการเชื่อมต่อกับ Google Sheet");
            } finally {
                btn.innerHTML = '<i data-lucide="send" class="w-4 h-4"></i> ยืนยันการส่งคำขอ';
                btn.disabled = false;
            }
        }

        async function approveReq(id) {
            if (!confirm('ยืนยันการอนุมัติคำขอนี้? ข้อมูลจะถูกอัพเดทใน Google Sheet')) return;

            let req = requests.find(r => r.id === id);
            if (req && req.status === 'pending') {
                try {
                    await fetch(WEB_APP_URL, {
                        method: 'POST',
                        body: JSON.stringify({ action: "updateStatus", receipt: req.receipt, status: "Approved" })
                    });
                    alert('อนุมัติเรียบร้อยแล้ว');
                    fetchDataFromSheet();
                } catch (e) { alert("เกิดข้อผิดพลาดในการเชื่อมต่อ"); }
            }
        }

        async function rejectReq(id) {
            if (!confirm('ยืนยันการปฏิเสธคำขอนี้? ข้อมูลจะถูกอัพเดทใน Google Sheet')) return;

            let req = requests.find(r => r.id === id);
            if (req && req.status === 'pending') {
                try {
                    await fetch(WEB_APP_URL, {
                        method: 'POST',
                        body: JSON.stringify({ action: "updateStatus", receipt: req.receipt, status: "Rejected" })
                    });
                    alert('ปฏิเสธคำขอเรียบร้อย');
                    fetchDataFromSheet();
                } catch (e) { alert("เกิดข้อผิดพลาดในการเชื่อมต่อ"); }
            }
        }

        function calculatePoints() {
            let quota = parseFloat(document.getElementById('empQuota').value) || 0;
            let rollover = parseFloat(document.getElementById('empRollover').value) || 0;
            if (rollover > 20000) {
                rollover = 20000;
                document.getElementById('empRollover').value = 20000;
            }
            let total = quota + rollover;
            document.getElementById('empTotalPoints').innerText = total.toLocaleString();
        }

        async function submitAddEmployee(e) {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            btn.innerHTML = '<i data-lucide="loader-2" class="w-5 h-5 animate-spin"></i> กำลังบันทึกข้อมูลลง Sheet...';
            btn.disabled = true;

            const name = document.getElementById('empName').value;
            const email = document.getElementById('empEmail').value;
            const scgId = document.getElementById('empScgId').value;
            const quota = parseFloat(document.getElementById('empQuota').value) || 0;
            let rollover = parseFloat(document.getElementById('empRollover').value) || 0;

            if (rollover > 20000) rollover = 20000;
            const total = quota + rollover;

            const payload = {
                action: "addEmployee",
                name: name,
                email: email,
                scgId: scgId,
                quota: quota,
                rollover: rollover,
                totalPoints: total
            };

            try {
                await fetch(WEB_APP_URL, {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });
                alert('เพิ่มพนักงานลง Google Sheet สำเร็จแล้ว!');
                switchHRTab('employees');
                fetchDataFromSheet();
            } catch (error) {
                alert("เกิดข้อผิดพลาดในการเชื่อมต่อกับ Google Sheet");
            } finally {
                btn.innerHTML = '<i data-lucide="user-plus" class="w-5 h-5"></i> บันทึกข้อมูลพนักงาน';
                btn.disabled = false;
            }
        }
    </script>
